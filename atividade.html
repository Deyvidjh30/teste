<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>cores</title>
<style>
    button{
        width: 10rem;
        height: 10rem;
        border: 1px solid white;
        border-radius: 100%;
        margin: 5px;
    }
</style>

<script>
function mudarCor(r,g,b){
    document.body.style.backgroundColor = "rgb(" + r + "," + g + "," + b + ")";
}
</script>
</head>
<body>

<script>
for(let i=0;i<100;i++){

    let r = parseInt(Math.random()*256)
    let g = parseInt(Math.random()*256)
    let b = parseInt(Math.random()*256)

    document.write(
        "<button onclick='mudarCor("+r+","+g+","+b+")' style='background-color: rgb("+r+","+g+","+b+")'></button>"
    )
}
</script>

</body>
</html>
